name: Sync CANPREPP calendar

on:
  schedule:
    - cron: '13 */3 * * *'
  workflow_dispatch:
    inputs:
      refresh:
        description: Reload every event page
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'requirements.txt'
      - 'config.json'
      - 'site/**'
      - 'data/**'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: canprepp-calendar
  cancel-in-progress: false

jobs:
  sync-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Validate sync behavior
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Sync public events
        env:
          REFRESH: ${{ inputs.refresh }}
        run: |
          if [ "$REFRESH" = "true" ]; then
            python scripts/sync.py --refresh
          else
            python scripts/sync.py
          fi
      - name: Save calendar changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data site
          if ! git diff --cached --quiet; then
            git commit -m 'Sync CANPREPP calendar'
            git push
          fi
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - name: Publish calendar
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
